spring.application.name=amqp-lab
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Consumer: take one message at a time per thread, run up to 4 Claude calls in parallel,
# and don't requeue a message whose processing threw (avoids infinite redelivery loops).
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=4
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Start at most this many messages per second across all consumer threads (0 = unlimited).
consumer.messages-per-second=1

# Claude (API key is read from the ANTHROPIC_API_KEY environment variable)
claude.model=claude-opus-5
claude.max-tokens=16000
