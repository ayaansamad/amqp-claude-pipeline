spring.application.name=amqp-lab
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Consumer: take one message at a time per thread, run up to 4 AI calls in parallel,
# and don't requeue a message whose processing threw (avoids infinite redelivery loops).
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=4
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# manual = consumer acks only after processing finishes, so a crash mid-processing leaves the
#          message unacked and RabbitMQ redelivers it.
# none   = RabbitMQ auto-ack: the message is removed as soon as it is delivered (lost on a crash).
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Start at most this many messages per second across all consumer threads (0 = unlimited).
consumer.messages-per-second=1

# AI backend: local Ollama (install: brew install ollama && ollama pull llama3.2:1b)
# Point ai.base-url at a dead port (e.g. AI_BASE_URL=http://localhost:9) to test retries + the DLQ.
ai.base-url=http://localhost:11434
ai.model=llama3.2:1b
ai.timeout-seconds=120

# Failure handling: transient AI errors (timeout, 5xx, 429) are retried via task_queue.retry
# after a delay; after max-retries failed retries (or on a permanent error) the message goes to task_queue.dlq.
consumer.max-retries=3
consumer.retry-delay-ms=5000

# Results store (in memory, mirrored to this JSON file)
results.file=results.json

# Lab switches
# Crash the app (no ack) as soon as a message starts processing. Enable for one run, e.g.
#   CONSUMER_CRASH_MID_PROCESSING=true ./mvnw spring-boot:run
consumer.crash-mid-processing=false
# Publish messages as persistent (delivery mode 2) so they survive a broker restart.
producer.persistent-messages=true
